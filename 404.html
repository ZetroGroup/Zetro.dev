<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Whoops!</title>
  </head>
  <style>
    body {
      background-color: rgba(0,0,0);
      color: white;
      font-family: Arial;
    }

    p {
      cursor: default;
    }

    h1 {
      cursor: default;
      font-size: 65px;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 25px;
      background: rgba(25, 25, 25, 0.1);
      color: white;
      border: 1px solid rgba(35, 35, 35, 0.3);
      border-radius: 50px;
      box-shadow: 0 1px 0 rgba(10, 10, 10, 0.06) inset;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-btn:hover {
      background: rgba(45, 45, 45, 0.4);
      border-color: rgba(66, 66, 66, 0.5);
      color: white;
      transform: translateY(-2px);
      cursor: pointer;
    }
  </style>
  <body>
      <br>
      <center><h1>Whoops!</h1></center>
      <center><p>We couldn't find that one in our database</p></center>
      <br>
      <center><button class="back-btn">Go back to Home?</button></center>
  </body>
</html>
